name: Release

# Push a tag vX.Y.Z (matching pyproject.toml and a "## vX.Y.Z" section in CHANGELOG.md)
# to publish a GitHub release with those notes and a proliant-mcp.tar.gz that uvx installs,
# and the same build to PyPI (trusted publishing: no token is stored anywhere),
# then list that version in the official MCP Registry (GitHub OIDC: no token either).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag must match pyproject.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Tests
        run: uv sync && uv run pytest -q

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="## v${VERSION} " 'index($0, v)==1 {found=1; next} found && /^## v/ {exit} found && !/^---$/ {print}' \
            CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no '## v${VERSION} ' section"
            exit 1
          fi
          cat release_notes.md

      - name: Build package
        # --force-pep517 builds with the pinned uv_build backend. uv 0.13's built-in builder
        # writes an sdist that older uv releases cannot extract ("numeric field was not a number").
        run: |
          uv build --force-pep517
          cp dist/proliant_mcp-*.tar.gz dist/proliant-mcp.tar.gz
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/proliant_mcp-*.tar.gz
            dist/proliant_mcp-*.whl
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/proliant-mcp.tar.gz \
            --title "$GITHUB_REF_NAME" --notes-file release_notes.md --verify-tag

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The registry verifies ownership from the "mcp-name:" line in the README on PyPI,
  # so this runs after the PyPI upload. server.json versions are set from the tag here.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Set server.json version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          for _ in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            sleep 30  # the PyPI JSON API can lag the upload
          done
          exit 1

  # What a customer does after a release: install from the release URLs and PyPI on a clean machine.
  verify:
    needs: [release, pypi]
    name: install release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # a macOS runner once sat 15 minutes without starting a step
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Pinned and latest release URLs install this version
        shell: pwsh
        run: |
          $want = "proliant-mcp $($env:GITHUB_REF_NAME.TrimStart('v')):"
          foreach ($url in @(
              "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/proliant-mcp.tar.gz",
              "https://github.com/${{ github.repository }}/releases/latest/download/proliant-mcp.tar.gz")) {
            $out = uvx --python 3.13 --refresh-package proliant-mcp --from $url proliant-mcp --check | Out-String
            Write-Output $out
            if (-not $out.Contains($want)) { throw "$url did not install $want" }
          }
      - name: PyPI installs it
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $want = "proliant-mcp ${version}:"
          for ($try = 1; $try -le 10; $try++) {
            $out = uvx --python 3.13 --refresh "proliant-mcp@$version" --check 2>&1 | Out-String
            if ($out.Contains($want)) { break }
            Start-Sleep -Seconds 15  # the PyPI index can lag the upload by a minute
          }
          Write-Output $out
          if (-not $out.Contains($want)) { throw "PyPI did not install $want" }
      - name: An old uv (0.8.0) also installs it
        shell: pwsh
        run: |
          $want = "proliant-mcp $($env:GITHUB_REF_NAME.TrimStart('v')):"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/proliant-mcp.tar.gz"
          $out = uvx uv@0.8.0 tool run --from $url proliant-mcp --check | Out-String
          Write-Output $out
          if (-not $out.Contains($want)) { throw "uv 0.8.0 did not install $want" }
