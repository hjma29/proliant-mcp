# Copy to ~/.config/hpe-compute-mcp/inventory.ini (or point HPE_COMPUTE_MCP_CONFIG at it)
# and chmod 600 it. Never commit the real file.
#
# [defaults] holds shared credentials. Every other section is one target; the
# section name is the friendly name the AI uses (e.g. "dl380-gen11").
# `type` is ilo (default), oneview or com. username defaults to Administrator.

[defaults]
username = Administrator
password = changeme

# ── iLOs ──
[dl380-gen11]
host = 192.0.2.10

[dl345-gen12]
host = 192.0.2.20
username = monitor
password = another-password
# verify_ssl = true   # only if the iLO has a CA-signed certificate

# ── HPE OneView / Synergy Composer (a read-only user is enough) ──
[synergy]
type = oneview
host = 192.0.2.100
username = readonly
password = changeme

# ── HPE Compute Ops Management: a GreenLake API client with a COM role ──
# (Skip this if you already ran `proliant com login`; that login is reused.)
[greenlake]
type = com
client_id = 00000000-0000-0000-0000-000000000000
client_secret = changeme
# region: us-west, eu-central or ap-northeast
region = us-west
