# Copy to ~/.config/proliant-mcp/inventory.ini (or point PROLIANT_MCP_CONFIG at it)
# and chmod 600 it. Never commit the real file.
#
# [defaults] holds shared iLO credentials. Every other section is one server;
# the section name is the friendly name the AI uses (e.g. "dl380-gen11").
# username defaults to Administrator when not set anywhere.

[defaults]
username = Administrator
password = changeme

[dl380-gen11]
host = 192.0.2.10

[dl345-gen12]
host = 192.0.2.20
username = monitor
password = another-password
# verify_ssl = true   # only if the iLO has a CA-signed certificate

# Non-iLO sections (e.g. proliant-cli's OneView entries) are ignored.
[my-oneview]
host = 192.0.2.100
type = oneview
