[project]
name = "proliant-mcp"
version = "0.15.4"
description = "MCP server for HPE compute: AI tools for ProLiant iLO (Redfish), HPE Compute Ops Management (GreenLake) and HPE OneView / Synergy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "hjma29" }]
keywords = ["mcp", "hpe", "proliant", "ilo", "redfish", "oneview", "synergy", "compute-ops-management", "greenlake", "fastmcp", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=4.2.0",
    "httpx>=0.27",
]

[project.scripts]
proliant-mcp = "proliant_mcp.server:main"

[project.urls]
Homepage = "https://github.com/hjma29/proliant-mcp"
Repository = "https://github.com/hjma29/proliant-mcp"
Changelog = "https://github.com/hjma29/proliant-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/hjma29/proliant-mcp/issues"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
