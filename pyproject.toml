[project]
name = "hpe-compute-mcp"
version = "0.2.0"
description = "MCP server for HPE compute: read-only tools for ProLiant iLO (Redfish), HPE Compute Ops Management (GreenLake) and HPE OneView / Synergy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "hjma29" }]
keywords = ["mcp", "hpe", "proliant", "ilo", "redfish", "oneview", "synergy", "compute-ops-management", "greenlake", "fastmcp", "ai-agent"]
dependencies = [
    "fastmcp>=4.2.0",
    "httpx>=0.27",
]

[project.scripts]
hpe-compute-mcp = "hpe_compute_mcp.server:main"
# Older name, kept so existing MCP client configs keep working.
proliant-mcp = "hpe_compute_mcp.server:main"

[project.urls]
Repository = "https://github.com/hjma29/hpe-compute-mcp"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
